<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">Toy cost and score plot with a Pareto frontier</title>
<desc id="d">Five made-up models. P costs $1 and scores 40, Q $2 and 55, R $3 and 50, S $6 and 70, T $8 and 65. A line joins P, Q and S, the frontier. R and T are grey: Q beats R and S beats T on both cost and score.</desc>
<rect width="960" height="540" fill="#ffffff"/>
<line x1="110" y1="450.0" x2="920" y2="450.0" stroke="#e3e3e3" stroke-width="2"/>
<text x="96" y="459.0" font-size="26" text-anchor="end" fill="#444">30</text>
<line x1="110" y1="366.0" x2="920" y2="366.0" stroke="#e3e3e3" stroke-width="2"/>
<text x="96" y="375.0" font-size="26" text-anchor="end" fill="#444">40</text>
<line x1="110" y1="282.0" x2="920" y2="282.0" stroke="#e3e3e3" stroke-width="2"/>
<text x="96" y="291.0" font-size="26" text-anchor="end" fill="#444">50</text>
<line x1="110" y1="198.0" x2="920" y2="198.0" stroke="#e3e3e3" stroke-width="2"/>
<text x="96" y="207.0" font-size="26" text-anchor="end" fill="#444">60</text>
<line x1="110" y1="114.0" x2="920" y2="114.0" stroke="#e3e3e3" stroke-width="2"/>
<text x="96" y="123.0" font-size="26" text-anchor="end" fill="#444">70</text>
<line x1="110" y1="30.0" x2="920" y2="30.0" stroke="#e3e3e3" stroke-width="2"/>
<text x="96" y="39.0" font-size="26" text-anchor="end" fill="#444">80</text>
<text x="110.0" y="486" font-size="26" text-anchor="middle" fill="#444">$0</text>
<text x="200.0" y="486" font-size="26" text-anchor="middle" fill="#444">$1</text>
<text x="290.0" y="486" font-size="26" text-anchor="middle" fill="#444">$2</text>
<text x="380.0" y="486" font-size="26" text-anchor="middle" fill="#444">$3</text>
<text x="470.0" y="486" font-size="26" text-anchor="middle" fill="#444">$4</text>
<text x="560.0" y="486" font-size="26" text-anchor="middle" fill="#444">$5</text>
<text x="650.0" y="486" font-size="26" text-anchor="middle" fill="#444">$6</text>
<text x="740.0" y="486" font-size="26" text-anchor="middle" fill="#444">$7</text>
<text x="830.0" y="486" font-size="26" text-anchor="middle" fill="#444">$8</text>
<text x="920.0" y="486" font-size="26" text-anchor="middle" fill="#444">$9</text>
<line x1="110" y1="450" x2="920" y2="450" stroke="#444" stroke-width="2"/>
<line x1="110" y1="30" x2="110" y2="450" stroke="#444" stroke-width="2"/>
<text x="515.0" y="528" font-size="28" text-anchor="middle" fill="#222">Cost (cheaper to the left)</text>
<text transform="translate(34 240.0) rotate(-90)" font-size="28" text-anchor="middle" fill="#222">Score (better toward the top)</text>
<polyline points="200.0,366.0 290.0,240.0 650.0,114.0" fill="none" stroke="#2166ac" stroke-width="5"/>
<circle cx="200.0" cy="366.0" r="15" fill="#2166ac"/>
<text x="200.0" y="340.0" font-size="34" font-weight="bold" text-anchor="middle" fill="#2166ac">P</text>
<circle cx="290.0" cy="240.0" r="15" fill="#2166ac"/>
<text x="290.0" y="214.0" font-size="34" font-weight="bold" text-anchor="middle" fill="#2166ac">Q</text>
<circle cx="380.0" cy="282.0" r="15" fill="#9a9a9a"/>
<text x="380.0" y="328.0" font-size="34" font-weight="bold" text-anchor="middle" fill="#9a9a9a">R</text>
<circle cx="650.0" cy="114.0" r="15" fill="#2166ac"/>
<text x="650.0" y="88.0" font-size="34" font-weight="bold" text-anchor="middle" fill="#2166ac">S</text>
<circle cx="830.0" cy="156.0" r="15" fill="#9a9a9a"/>
<text x="830.0" y="202.0" font-size="34" font-weight="bold" text-anchor="middle" fill="#9a9a9a">T</text>
<text x="677.0" y="63.6" font-size="26" fill="#2166ac">Frontier: P, Q, S</text>
<text x="434.0" y="332.4" font-size="26" fill="#6f6f6f">Grey: dominated</text>
</svg>
